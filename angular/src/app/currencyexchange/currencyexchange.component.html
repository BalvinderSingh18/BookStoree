<div class="card p-4">
  <h3>Currency Converter</h3>
 
  <div class="container mt-4">
  <div class="row">
    <div class="col-md-3">
      <label for="fromCurrency">From Currency</label>
      <select [(ngModel)]="fromCurrency" class="form-control" name="fromCurrency">
        <option *ngFor="let currency of currencies" [value]="currency">{{ currency }}</option>
      </select>
    </div>
 
    <div class="col-md-3">
      <label for="toCurrency">To Currency</label>
      <select [(ngModel)]="toCurrency" class="form-control" name="toCurrency">
        <option *ngFor="let currency of currencies" [value]="currency">{{ currency }}</option>
      </select>
    </div>
 
    <div class="col-md-3">
      <label for="amount">Amount</label>
      <input type="number" [(ngModel)]="amount" class="form-control" name="amount" />
    </div>
 
    <div class="col-md-3 d-flex align-items-end">
      <button class="btn btn-primary w-100" (click)="convert()">Convert</button>
    </div>
  </div>
 
  <div class="row mt-3" *ngIf="convertedAmount !== null">
    <div class="col">
      <div class="alert alert-success">
        {{ amount }} {{ fromCurrency }} = {{ convertedAmount }} {{ toCurrency }}
      </div>
    </div>
  </div>
 
  <div class="row mt-3" *ngIf="error">
    <div class="col">
      <div class="alert alert-danger">{{ error }}</div>
    </div>
  </div>
</div>
 
</div>
