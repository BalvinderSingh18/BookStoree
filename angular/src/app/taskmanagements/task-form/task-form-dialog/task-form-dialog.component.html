<form
  class="form-horizontal"
  autocomplete="off"
  #employeeForm="ngForm"
  (ngSubmit)="save()"
>
  <abp-modal-header
    [title]="
      isEditMode ? ('EditTask' | localize) : ('CreateNewTask' | localize)
    "
    (onCloseClick)="bsModalRef.hide()"
  ></abp-modal-header>

  <div class="modal-body">
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="Name">
        {{ "Title" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="Name"
          id="Name"
          maxlength="20"
          placeholder="Enter Name"
          pattern="^[a-zA-Z ]+$"
          required
          [(ngModel)]="task.title"
          #NameModel="ngModel"
          #NameEl
        />
        <div *ngIf="NameModel.invalid && NameModel.touched" class="text-danger">
          <div *ngIf="NameModel.errors?.pattern">
            Only alphabets and spaces are allowed.
          </div>
        </div>
        <abp-validation-summary
          [control]="NameModel"
          [controlEl]="NameEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="Address">
        {{ "Description" | localize }}
      </label>
      <div class="col-md-9">
        <input
          type="text"
          class="form-control"
          name="Address"
          id="Address"
          maxlength="50"
          placeholder="Enter Name"
          pattern="^[a-zA-Z0-9, ]+$"
          required
          [(ngModel)]="task.description"
          #AddressModel="ngModel"
          #AddressEl
        />
        <div
          *ngIf="AddressModel.invalid && AddressModel.touched"
          class="text-danger"
        >
          <div *ngIf="AddressModel.errors?.pattern">
            Only alphabets,Numbers,Commas and spaces are allowed.
          </div>
        </div>
        <abp-validation-summary
          [control]="AddressModel"
          [controlEl]="AddressEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="Gender">
        {{ "Status" | localize }}
      </label>
      <div class="col-md-9">
        <select
          [(ngModel)]="selectedStatus"
          class="form-control"
          id="Gender"
          name="Gender"
          required
          #GenderModel="ngModel"
          #GenderEl
        >
          <option [ngValue]="undefined" disabled>Select Select</option>
          <option [ngValue]="0">New</option>
          <option [ngValue]="1">InProgress</option>
          <option [ngValue]="2">Complete</option>
        </select>
        <abp-validation-summary
          [control]="GenderModel"
          [controlEl]="GenderEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label" for="Department">
        {{ "User" | localize }}
      </label>
      <div class="col-md-9">
        <select
          class="form-control"
          id="Department"
          name="Department"
          required
          [(ngModel)]="task.assignedUserId"
          #departmentModel="ngModel"
          #departmentEl
        >
          <option [ngValue]="undefined" disabled>Select User</option>
          <option *ngFor="let user of users" [value]="user.id">
            {{ user.userName }}
          </option>
        </select>
        <abp-validation-summary
          [control]="departmentModel"
          [controlEl]="departmentEl"
        ></abp-validation-summary>
      </div>
    </div>
    <div class="form-group row required">
<ng-container *ngIf="isAdmin; else readonlyView">
  <input
    type="text"
    class="form-control"
    id="diss"
    name="diss"
    maxlength="100"
    [(ngModel)]="task.discussion"
  />
</ng-container>

<ng-template #readonlyView>
  <input
    type="text"
    class="form-control"
    [value]="task?.discussion || ''"
    readonly
  />
  <small class="form-text text-muted">
    You can only view this field. Only admin can edit.
  </small>
</ng-template>
    </div>
  </div>
  <abp-modal-footer
    [cancelDisabled]="saving"
    [saveDisabled]="!employeeForm.form.valid || saving"
    (onCancelClick)="bsModalRef.hide()"
  ></abp-modal-footer>
</form>
